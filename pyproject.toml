[project]
name = "songrec"
version = "0.1.0"
description = ""
authors = [
    {name = "boltholds",email = "bolthold7507@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "fastapi (>=0.136.3,<0.137.0)",
    "typer (>=0.26.4,<0.27.0)",
    "langgraph (>=1.2.2,<2.0.0)",
    "typing-extensions (>=4.15.0,<5.0.0)",
    "numpy (>=2.4.6,<3.0.0)",
    "librosa (>=0.11.0,<0.12.0)",
    "uvicorn (>=0.48.0,<0.49.0)",
    "python-multipart (>=0.0.30,<0.0.31)",
]

[tool.poetry]
packages = [{include = "songrec", from = "src"}]

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"


[tool.poetry.group.ML.dependencies]
torch = {source = "pytorch-cu128"}
torchaudio = {source = "pytorch-cu128"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.scripts]
songrec = "songrec.cli:app"
songrec-api = "songrec.cli:serve"

[dependency-groups]
ML = [
    "torch (==2.7.1)",
    "demucs (>=4.0.1,<5.0.0)",
    "torchaudio (==2.7.1)",
    "faster-whisper (>=1.2.1,<2.0.0)"
]
